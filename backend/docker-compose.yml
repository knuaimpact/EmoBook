version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: emobook_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qweqwe123!
      POSTGRES_DB: emobook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
