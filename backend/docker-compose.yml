services:
  mysql:
    image: mysql:8.4
    container_name: emobook-mysql
    environment:
      MYSQL_DATABASE: emobook
      MYSQL_USER: emobook
      MYSQL_PASSWORD: emobook
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - emobook-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  emobook-mysql-data:

